    <ellipse cx="660" cy="680" rx="240" ry="160" fill="url(#nebulaB)" filter="url(#soft)"/>
    <g transform="translate(512 520) scale(1.3 1.15) translate(-512 -520)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <use href="#wavePath" stroke="url(#wave)" stroke-width="44"/>
      <use href="#wavePath" stroke="#ffffff" stroke-width="12" opacity="0.8"/>
    </g>
  </g>
</svg>
