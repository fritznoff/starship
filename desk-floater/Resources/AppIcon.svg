<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Desk floater app icon: a close-up of a rocket hull with one big porthole looking out
       into space; a glowing voice waveform runs across the glass. -->
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a2130"/>
      <stop offset="0.28" stop-color="#4a5568"/>
      <stop offset="0.42" stop-color="#5d6a80"/>
      <stop offset="0.75" stop-color="#2a3243"/>
      <stop offset="1" stop-color="#121722"/>
    </linearGradient>
    <linearGradient id="rim" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#e8edf5"/>
      <stop offset="0.35" stop-color="#8a96aa"/>
      <stop offset="0.65" stop-color="#3b4558"/>
      <stop offset="1" stop-color="#a7b2c4"/>
    </linearGradient>
    <linearGradient id="rimInner" x1="0.8" y1="1" x2="0.2" y2="0">
      <stop offset="0" stop-color="#cfd7e3"/>
      <stop offset="0.5" stop-color="#465166"/>
      <stop offset="1" stop-color="#1b2130"/>
    </linearGradient>
    <radialGradient id="space" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#1f2a6b"/>
      <stop offset="0.55" stop-color="#0d1238"/>
      <stop offset="1" stop-color="#05061a"/>
    </radialGradient>
    <radialGradient id="nebulaA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b44cff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#b44cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#24d6ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#24d6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36e4ff" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#36e4ff"/>
      <stop offset="0.55" stop-color="#8f7bff"/>
      <stop offset="0.8" stop-color="#ff5fd2"/>
      <stop offset="1" stop-color="#ff5fd2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185.4"/></clipPath>
    <clipPath id="glass"><circle cx="512" cy="512" r="232"/></clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <path id="wavePath" d="M300 520.0 L304 520.1 L308 520.1 L312 519.8 L316 519.2 L320 518.1 L324 516.6 L328 514.8 L332 512.9 L336 511.0 L340 509.6 L344 509.0 L348 509.4 L352 511.2 L356 514.5 L360 519.2 L364 525.3 L368 532.3 L372 539.9 L376 547.3 L380 554.0 L384 559.2 L388 562.1 L392 562.3 L396 559.4 L400 553.0 L404 543.5 L408 531.0 L412 516.3 L416 500.3 L420 484.1 L424 468.7 L428 455.5 L432 445.7 L436 440.1 L440 439.5 L444 444.2 L448 454.3 L452 469.4 L456 488.7 L460 511.0 L464 534.9 L468 558.9 L472 581.3 L476 600.5 L480 615.1 L484 624.0 L488 626.4 L492 622.0 L496 611.1 L500 594.2 L504 572.4 L508 547.1 L512 520.0 L516 492.9 L520 467.6 L524 445.8 L528 428.9 L532 418.0 L536 413.6 L540 416.0 L544 424.9 L548 439.5 L552 458.7 L556 481.1 L560 505.1 L564 529.0 L568 551.3 L572 570.6 L576 585.7 L580 595.8 L584 600.5 L588 599.9 L592 594.3 L596 584.5 L600 571.3 L604 555.9 L608 539.7 L612 523.7 L616 509.0 L620 496.5 L624 487.0 L628 480.6 L632 477.7 L636 477.9 L640 480.8 L644 486.0 L648 492.7 L652 500.1 L656 507.7 L660 514.7 L664 520.8 L668 525.5 L672 528.8 L676 530.6 L680 531.0 L684 530.4 L688 529.0 L692 527.1 L696 525.2 L700 523.4 L704 521.9 L708 520.8 L712 520.2 L716 519.9 L720 519.9 L724 520.0"/>
  </defs>

  <!-- tile drop shadow, inside Apple's grid margins -->
  <rect x="100" y="112" width="824" height="824" rx="185.4" fill="#000" opacity="0.3" filter="url(#shadow)"/>

  <g clip-path="url(#tile)">
    <!-- rocket hull: a vertical cylinder lit from the left -->
    <rect x="100" y="100" width="824" height="824" fill="url(#hull)"/>
    <!-- panel seams -->
    <g stroke="#0b0f18" stroke-opacity="0.55" stroke-width="6" fill="none">
      <path d="M100 190 Q512 225 924 190"/>
      <path d="M100 850 Q512 885 924 850"/>
      <path d="M232 100 V924"/>
      <path d="M792 100 V924"/>
    </g>
    <g stroke="#9aa6ba" stroke-opacity="0.25" stroke-width="3" fill="none">
      <path d="M100 196 Q512 231 924 196"/>
      <path d="M100 856 Q512 891 924 856"/>
    </g>
    <!-- rivets along the seams -->
    <g fill="#8d99ae" fill-opacity="0.55">
      <circle cx="190" cy="160" r="7"/><circle cx="300" cy="166" r="7"/><circle cx="440" cy="171" r="7"/>
      <circle cx="584" cy="171" r="7"/><circle cx="724" cy="166" r="7"/><circle cx="834" cy="160" r="7"/>
      <circle cx="190" cy="895" r="7"/><circle cx="300" cy="900" r="7"/><circle cx="440" cy="904" r="7"/>
      <circle cx="584" cy="904" r="7"/><circle cx="724" cy="900" r="7"/><circle cx="834" cy="895" r="7"/>
    </g>
  </g>

  <!-- porthole shadow on the hull -->
  <circle cx="520" cy="532" r="312" fill="#000" opacity="0.45" filter="url(#glow)"/>
  <!-- porthole rim -->
  <circle cx="512" cy="512" r="304" fill="url(#rim)"/>
  <circle cx="512" cy="512" r="258" fill="url(#rimInner)"/>
  <!-- bolts -->
  <g fill="#1b2130" stroke="#c9d1de" stroke-width="3">
    <circle cx="512" cy="230" r="11"/><circle cx="711" cy="313" r="11"/>
    <circle cx="794" cy="512" r="11"/><circle cx="711" cy="711" r="11"/>
    <circle cx="512" cy="794" r="11"/><circle cx="313" cy="711" r="11"/>
    <circle cx="230" cy="512" r="11"/><circle cx="313" cy="313" r="11"/>
  </g>

  <!-- the view through the glass -->
  <g clip-path="url(#glass)">
    <rect x="270" y="270" width="484" height="484" fill="url(#space)"/>
    <ellipse cx="420" cy="390" rx="220" ry="150" fill="url(#nebulaA)" filter="url(#soft)"/>
    <ellipse cx="640" cy="650" rx="200" ry="130" fill="url(#nebulaB)" filter="url(#soft)"/>
    <g fill="#ffffff">
      <circle cx="350" cy="360" r="3"/><circle cx="410" cy="310" r="2"/><circle cx="600" cy="330" r="3.5"/>
      <circle cx="680" cy="400" r="2"/><circle cx="330" cy="640" r="2.5"/><circle cx="460" cy="690" r="2"/>
      <circle cx="560" cy="380" r="2"/><circle cx="700" cy="590" r="3"/><circle cx="390" cy="450" r="1.8"/>
      <circle cx="620" cy="700" r="2.2"/><circle cx="510" cy="300" r="1.8"/><circle cx="300" cy="530" r="2"/>
    </g>
    <path d="M600 330 h-14 M600 330 h14 M600 330 v-14 M600 330 v14" stroke="#ffffff" stroke-width="2" stroke-opacity="0.7"/>

    <!-- voice waveform: a wide glow under a crisp line -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <use href="#wavePath" stroke="url(#wave)" stroke-width="34" opacity="0.7" filter="url(#glow)"/>
      <use href="#wavePath" stroke="url(#wave)" stroke-width="14"/>
      <use href="#wavePath" stroke="#ffffff" stroke-width="4" opacity="0.85"/>
    </g>

    <!-- glass reflection -->
    <path d="M330 420 A200 200 0 0 1 560 300 A230 230 0 0 0 360 470 Z" fill="url(#glare)"/>
  </g>
  <circle cx="512" cy="512" r="232" fill="none" stroke="#0a0d16" stroke-width="8" opacity="0.8"/>
</svg>
